name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dragon_house_test
          POSTGRES_USER: dragon_house
          POSTGRES_PASSWORD: dragon_house
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_house -d dragon_house_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: dragon-house-backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dragon_house:dragon_house@localhost:5432/dragon_house_test
      LOG_LEVEL: silent
      DISCORD_SYNC_AUTO_ENABLED: "false"
      DISCORD_ORCHESTRATION_ENABLED: "false"
      DISCORD_TOWER_SYNC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dragon-house-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --poolOptions.forks.singleFork
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:verify
      - run: npm run db:migrate:status

  frontend:
    name: Chrome Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chrome_app/package-lock.json
      - run: npm ci
      - run: npx wxt prepare
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build:chrome
      - run: npm test

  real_backend_e2e:
    name: Real backend browser E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dragon_house_e2e
          POSTGRES_USER: dragon_house
          POSTGRES_PASSWORD: dragon_house
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_house -d dragon_house_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      E2E_TEST_MODE: "true"
      E2E_DATABASE_NAME: dragon_house_e2e
      DATABASE_URL: postgresql://dragon_house:dragon_house@localhost:5432/dragon_house_e2e
      PORT: "8788"
      LOG_LEVEL: silent
      DISCORD_SYNC_AUTO_ENABLED: "false"
      DISCORD_ORCHESTRATION_ENABLED: "false"
      DISCORD_TOWER_SYNC_ENABLED: "false"
      PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:8788
      PLAYWRIGHT_SKIP_E2E_DB_SETUP: "true"
      VITE_DRAGON_HOUSE_BACKEND_API_BASE_URL: http://127.0.0.1:8788
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dragon-house-backend/package-lock.json
            chrome_app/package-lock.json
      - run: npm ci
        working-directory: dragon-house-backend
      - run: npm ci
        working-directory: chrome_app
      - run: npm run e2e:db:reset
        working-directory: dragon-house-backend
      - run: npm run e2e:db:setup
        working-directory: dragon-house-backend
      - run: npm run db:verify
        working-directory: dragon-house-backend
      - run: npm run db:migrate:status
        working-directory: dragon-house-backend
      - run: npm run build
        working-directory: dragon-house-backend
      - run: npm run e2e:start > ../backend-e2e.out.log 2> ../backend-e2e.err.log &
        working-directory: dragon-house-backend
      - run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8788/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready"
          cat backend-e2e.out.log || true
          cat backend-e2e.err.log || true
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: chrome_app
      - run: npm run build:chrome
        working-directory: chrome_app
      - run: npm run test:e2e:real
        working-directory: chrome_app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-backend-e2e-artifacts
          path: |
            chrome_app/test-results
            chrome_app/playwright-report
            backend-e2e.out.log
            backend-e2e.err.log
